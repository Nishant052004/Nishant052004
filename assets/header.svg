<!-- Nishant Rai · Neon Architect Hero Banner · Animated SVG -->
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="280" viewBox="0 0 840 280">
  <defs>
    <!-- Gradient backgrounds -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#0d0d2b"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(168,85,247,0)"/>
      <stop offset="20%" stop-color="rgba(168,85,247,0.6)"/>
      <stop offset="50%" stop-color="rgba(236,72,153,0.8)"/>
      <stop offset="80%" stop-color="rgba(6,182,212,0.6)"/>
      <stop offset="100%" stop-color="rgba(6,182,212,0)"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(168,85,247,0.4)"/>
      <stop offset="100%" stop-color="rgba(168,85,247,0)"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(6,182,212,0.35)"/>
      <stop offset="100%" stop-color="rgba(6,182,212,0)"/>
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(236,72,153,0.3)"/>
      <stop offset="100%" stop-color="rgba(236,72,153,0)"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Grid pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(168,85,247,0.04)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;family=Inter:wght@400;600;700;900&amp;display=swap');
    @keyframes float1 { 0%,100% { transform: translate(0,0); opacity:0.5; } 50% { transform: translate(20px,-15px); opacity:0.9; } }
    @keyframes float2 { 0%,100% { transform: translate(0,0); opacity:0.4; } 50% { transform: translate(-25px,12px); opacity:0.8; } }
    @keyframes float3 { 0%,100% { transform: translate(0,0); opacity:0.6; } 50% { transform: translate(15px,18px); opacity:1; } }
    @keyframes pulse { 0%,100% { opacity:0.3; transform:scale(1); } 50% { opacity:0.7; transform:scale(1.15); } }
    @keyframes scan { 0% { transform: translateX(-850px); } 100% { transform: translateX(850px); } }
    @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    @keyframes dash { to { stroke-dashoffset: -20; } }
    @keyframes fadeSlide { 0% { opacity:0; transform:translateY(8px); } 100% { opacity:1; transform:translateY(0); } }
    @keyframes particle { 0%,100% { opacity:0; } 30%,70% { opacity:var(--peak,0.6); } }
    .orb1 { animation: float1 7s ease-in-out infinite; }
    .orb2 { animation: float2 9s ease-in-out infinite 0.5s; }
    .orb3 { animation: float3 8s ease-in-out infinite 1s; }
    .node-pulse { animation: pulse 3s ease-in-out infinite; }
    .scanner { animation: scan 5s linear infinite; }
    .cursor-blink { animation: blink 1s step-end infinite; }
    .dash-anim { animation: dash 2s linear infinite; }
    .p { animation: particle var(--dur) ease-in-out infinite; animation-delay: var(--d, 0s); opacity:0; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>

  <!-- Base -->
  <rect width="840" height="280" rx="16" fill="url(#bg)"/>
  <rect width="840" height="280" rx="16" fill="url(#grid)"/>

  <!-- Floating orbs -->
  <ellipse class="orb1" cx="120" cy="80" rx="120" ry="100" fill="url(#orb1)"/>
  <ellipse class="orb2" cx="700" cy="200" rx="140" ry="110" fill="url(#orb2)"/>
  <ellipse class="orb3" cx="420" cy="140" rx="100" ry="80" fill="url(#orb3)"/>

  <!-- Scanner line -->
  <rect class="scanner" y="0" width="840" height="280" fill="url(#lineGlow)" opacity="0.08"/>

  <!-- Constellation nodes + lines -->
  <g opacity="0.25">
    <line x1="80" y1="50" x2="200" y2="90" stroke="rgba(168,85,247,0.4)" stroke-width="0.6" stroke-dasharray="4 4" class="dash-anim"/>
    <line x1="200" y1="90" x2="350" y2="60" stroke="rgba(6,182,212,0.3)" stroke-width="0.6" stroke-dasharray="4 4" class="dash-anim"/>
    <line x1="600" y1="220" x2="740" y2="180" stroke="rgba(236,72,153,0.3)" stroke-width="0.6" stroke-dasharray="4 4" class="dash-anim"/>
    <line x1="500" y1="250" x2="600" y2="220" stroke="rgba(168,85,247,0.3)" stroke-width="0.6" stroke-dasharray="4 4" class="dash-anim"/>
    <line x1="740" y1="180" x2="790" y2="130" stroke="rgba(6,182,212,0.3)" stroke-width="0.6" stroke-dasharray="4 4" class="dash-anim"/>
  </g>
  <g>
    <circle class="node-pulse" cx="80" cy="50" r="2.5" fill="#a855f7" opacity="0.7"/>
    <circle class="node-pulse" cx="200" cy="90" r="2" fill="#06b6d4" opacity="0.6" style="animation-delay:0.5s"/>
    <circle class="node-pulse" cx="350" cy="60" r="1.8" fill="#ec4899" opacity="0.5" style="animation-delay:1s"/>
    <circle class="node-pulse" cx="600" cy="220" r="2.2" fill="#a855f7" opacity="0.6" style="animation-delay:0.3s"/>
    <circle class="node-pulse" cx="740" cy="180" r="2" fill="#06b6d4" opacity="0.5" style="animation-delay:0.8s"/>
    <circle class="node-pulse" cx="790" cy="130" r="1.5" fill="#ec4899" opacity="0.5" style="animation-delay:1.2s"/>
    <circle class="node-pulse" cx="500" cy="250" r="1.8" fill="#f59e0b" opacity="0.5" style="animation-delay:0.6s"/>
  </g>

  <!-- Floating particles -->
  <circle class="p" cx="150" cy="200" r="1" fill="#a855f7" style="--dur:4s;--d:0s;--peak:0.6"/>
  <circle class="p" cx="300" cy="40" r="0.8" fill="#06b6d4" style="--dur:5s;--d:1s;--peak:0.5"/>
  <circle class="p" cx="550" cy="70" r="1.2" fill="#ec4899" style="--dur:3.5s;--d:0.5s;--peak:0.7"/>
  <circle class="p" cx="680" cy="100" r="0.9" fill="#f59e0b" style="--dur:4.5s;--d:2s;--peak:0.5"/>
  <circle class="p" cx="400" cy="240" r="1" fill="#a855f7" style="--dur:6s;--d:1.5s;--peak:0.4"/>
  <circle class="p" cx="760" cy="50" r="0.7" fill="#06b6d4" style="--dur:5s;--d:0.8s;--peak:0.6"/>
  <circle class="p" cx="50" cy="240" r="0.9" fill="#ec4899" style="--dur:4s;--d:2.5s;--peak:0.5"/>
  <circle class="p" cx="250" cy="260" r="1.1" fill="#f59e0b" style="--dur:5.5s;--d:0.3s;--peak:0.4"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="840" height="1.5" rx="1" fill="url(#accent3)" opacity="0.6"/>

  <!-- Left decorative bracket -->
  <g opacity="0.3" filter="url(#softGlow)">
    <line x1="32" y1="95" x2="32" y2="185" stroke="url(#accent1)" stroke-width="1.5"/>
    <line x1="32" y1="95" x2="42" y2="95" stroke="url(#accent1)" stroke-width="1.5"/>
    <line x1="32" y1="185" x2="42" y2="185" stroke="url(#accent1)" stroke-width="1.5"/>
  </g>

  <!-- Main title -->
  <text x="420" y="105" text-anchor="middle" font-family="'Inter', sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="6" filter="url(#glow)">NISHANT RAI</text>

  <!-- Subtitle with gradient -->
  <text x="420" y="140" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="url(#accent2)" letter-spacing="5" font-weight="700">AGENTIC AI ARCHITECT  ·  SYSTEMS ENGINEER</text>

  <!-- Typing line -->
  <g>
    <text x="240" y="175" font-family="'JetBrains Mono', monospace" font-size="10" fill="rgba(168,85,247,0.7)" font-weight="400">$</text>
    <text x="255" y="175" font-family="'JetBrains Mono', monospace" font-size="10" fill="rgba(200,200,230,0.6)" font-weight="400">building autonomous multi-agent systems</text>
    <rect class="cursor-blink" x="575" y="165" width="7" height="12" rx="1" fill="rgba(168,85,247,0.8)"/>
  </g>

  <!-- Tech pills -->
  <g>
    <rect x="180" y="200" width="72" height="22" rx="11" fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.35)" stroke-width="0.8"/>
    <text x="216" y="215" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#c084fc">Python</text>

    <rect x="262" y="200" width="72" height="22" rx="11" fill="rgba(6,182,212,0.12)" stroke="rgba(6,182,212,0.35)" stroke-width="0.8"/>
    <text x="298" y="215" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#67e8f9">FastAPI</text>

    <rect x="344" y="200" width="80" height="22" rx="11" fill="rgba(236,72,153,0.12)" stroke="rgba(236,72,153,0.35)" stroke-width="0.8"/>
    <text x="384" y="215" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#f9a8d4">LangChain</text>

    <rect x="434" y="200" width="88" height="22" rx="11" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.35)" stroke-width="0.8"/>
    <text x="478" y="215" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#fcd34d">TensorFlow</text>

    <rect x="532" y="200" width="64" height="22" rx="11" fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.35)" stroke-width="0.8"/>
    <text x="564" y="215" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#c084fc">Docker</text>

    <rect x="606" y="200" width="58" height="22" rx="11" fill="rgba(6,182,212,0.12)" stroke="rgba(6,182,212,0.35)" stroke-width="0.8"/>
    <text x="635" y="215" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#67e8f9">React</text>
  </g>

  <!-- Bottom status bar -->
  <rect x="0" y="252" width="840" height="28" fill="rgba(10,10,26,0.8)"/>
  <line x1="0" y1="252" x2="840" y2="252" stroke="rgba(168,85,247,0.15)" stroke-width="0.5"/>
  <circle cx="24" cy="266" r="3.5" fill="#22c55e" opacity="0.8"/>
  <text x="36" y="270" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(200,200,230,0.5)" font-weight="400">systems online</text>
  <text x="420" y="270" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(200,200,230,0.35)" font-weight="400">github.com/Nishant052004</text>
  <text x="808" y="270" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(168,85,247,0.5)" font-weight="400">v2.0</text>

  <!-- Bottom accent line -->
  <rect x="0" y="278" width="840" height="2" rx="1" fill="url(#accent3)" opacity="0.4"/>
</svg>
