name: Generate Pacman Contribution Graph

on:
  schedule:
    # Run once every 24 hours at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Pacman Contribution Graph SVGs
        run: |
          mkdir -p dist
          npx pacman-contribution-graph --platform github --username ${{ github.repository_owner }} --gameTheme github-dark -o dist/pacman-contribution-graph-dark.svg
          npx pacman-contribution-graph --platform github --username ${{ github.repository_owner }} --gameTheme github -o dist/pacman-contribution-graph.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update profile.svg with latest Pac-Man animation
        run: |
          python .github/scripts/embed_pacman.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/assets/profile.svg
          git commit -m "🟡 Update profile.svg with latest Pac-Man animation" || exit 0
          git push origin main
